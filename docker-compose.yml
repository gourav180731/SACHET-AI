# SACHET AI — docker-compose.yml (local-first dev topology)
# postgres:16+pgvector, redis, backend, frontend. Qdrant optional (profile: vector-alt).
name: sachet-ai

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sachet
      POSTGRES_PASSWORD: sachet
      POSTGRES_DB: sachet
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sachet -d sachet"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [data-net]

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [data-net]

  backend:
    build: ./backend
    env_file: .env
    environment:
      SACHET_DATABASE_URL: jdbc:postgresql://db:5432/sachet
      SACHET_DB_USER: sachet
      SACHET_DB_PASSWORD: sachet
      SACHET_STORAGE_PATH: /app/storage
      SACHET_SENSITIVE_MODE: "true"
      SACHET_ALLOW_EXTERNAL_MODELS: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [frontend-net, data-net]

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE: http://localhost:8000/api/v1
    depends_on:
      - backend
    networks: [frontend-net]

  # Optional: Qdrant mirror (pgvector remains default). Enable with:
  #   docker compose --profile vector-alt up
  qdrant:
    image: qdrant/qdrant:v1.9.0
    profiles: [vector-alt]
    volumes:
      - qdrantdata:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [data-net]

volumes:
  pgdata:
  redisdata:
  qdrantdata:

networks:
  frontend-net:
  data-net:
